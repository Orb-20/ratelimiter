spring.application.name=distributed-rate-limiter
server.port=8080

# Algorithm used by GET /api/rate-limit/test (FIXED_WINDOW | TOKEN_BUCKET | REDIS_TOKEN_BUCKET)
rate-limit.default-algorithm=TOKEN_BUCKET

# Implementation 1 - Fixed Window Counter: 100 requests per 60 seconds
rate-limit.counter.max-requests=100
rate-limit.counter.window-seconds=60

# Implementations 2 & 3 - Token Bucket: capacity 100, refill 10 tokens/second
rate-limit.token-bucket.capacity=100
rate-limit.token-bucket.refill-rate=10

# Redis (shared state for the distributed token bucket)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
rate-limit.redis.key-prefix=rate-limit:token-bucket:
rate-limit.redis.ttl-seconds=3600
# true  -> allow requests when Redis is down (availability)
# false -> reject requests when Redis is down (strict enforcement)
rate-limit.redis.fail-open=false

# Actuator - only the health endpoint, including Redis connectivity
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
